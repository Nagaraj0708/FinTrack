name: fintrack
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  supabase_flutter: ^2.17.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  csv: ^8.0.0
  uuid: ^4.6.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^18.0.1
  excel: ^4.0.3
  pinput: ^6.0.2
  font_awesome_flutter: ^11.0.0
  crypto: ^3.0.7
  permission_handler: ^11.3.0
  sqlite3: ^3.5.2
  mobile_scanner: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  freezed: any
  json_serializable: any
  drift_dev: any
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env.example
    - assets/icon.jpg
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
